name: Release

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'src/**'
      - 'schemas/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: rust
          token: ${{ secrets.GH_TOKEN }}

      - name: Merge release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          PR_NUMBER=$(echo '${{ steps.release.outputs.pr }}' | jq -r '.number')
          gh pr merge --merge "$PR_NUMBER" --delete-branch
          echo "Merged PR #$PR_NUMBER"

  build:
    needs: release
    if: needs.release.outputs.tag_name != ''
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-${{ matrix.target }}"

      - name: Build release
        run: cargo build --release --workspace --target ${{ matrix.target }} --locked

      - name: Prepare assets
        run: |
          cp target/${{ matrix.target }}/release/agbr${{ matrix.suffix }} agbr-${{ matrix.target }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: |
            agbr-${{ matrix.target }}
