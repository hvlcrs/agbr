name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BIN="agbr"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="agbr.exe"; fi
          mkdir -p dist
          cp "target/release/${BIN}" "dist/${BIN}"
          tar -C dist -czf "dist/agbr-${VERSION}-${TARGET}.tar.gz" "${BIN}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agbr-${{ matrix.target }}
          path: dist/*.tar.gz

  universal-macos:
    name: universal macOS binary
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agbr-x86_64-apple-darwin
          path: intel

      - uses: actions/download-artifact@v4
        with:
          name: agbr-aarch64-apple-darwin
          path: arm

      - name: Combine with lipo
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          lipo -create intel/agbr arm/agbr -output dist/agbr
          tar -C dist -czf dist/agbr-${VERSION}-universal-apple-darwin.tar.gz agbr

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agbr-universal-apple-darwin
          path: dist/*.tar.gz

  release:
    name: upload binaries to release
    needs: [build, universal-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist

      - name: Upload binaries
        run: |
          set -euo pipefail
          # The release + changelog are created by release-please. Fall back to
          # a bare release if it does not exist yet (race).
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
