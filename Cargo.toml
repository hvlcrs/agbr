[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/llm",
    "crates/inspect",
    "crates/planner",
    "crates/rawtherapee",
    "crates/mcp",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/hvlcrs/agbr"
authors = ["havelcyrus"]

[workspace.dependencies]
agbr-core = { path = "crates/core" }
agbr-llm = { path = "crates/llm" }
agbr-inspect = { path = "crates/inspect" }
agbr-planner = { path = "crates/planner" }
agbr-rawtherapee = { path = "crates/rawtherapee" }
agbr-mcp = { path = "crates/mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-std", "io-util", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
kamadak-exif = "0.6"
dirs = "5"
[profile.release]
strip = true
